<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Fósforos</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2c2c2c;
            color: #eee;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        .subtitulo { color: #aaa; margin-bottom: 20px; }

        .panel {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .puntaje-test {
            background: #444;
            border-radius: 12px;
            padding: 15px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .puntaje-test h2 {
            margin: 0 0 10px;
            font-size: 1.5em;
        }

        .zona-fosforos {
            min-height: 60px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .malas { background: rgba(73, 73, 73, 0.7); }
        .buenas { background: rgba(0, 0, 0, 0.5); }

        /* === ESTILOS NECESARIOS PARA LOS FÓSFOROS === */
        .tranquera {
            position: relative;
            width: 40px;
            height: 40px;
            margin: 4px;
            flex-shrink: 0;
        }

        .fosforo {
            position: absolute;
            width: 6px;
            height: 34px;
            background: url('./assets/fosforo.png') center / contain no-repeat;
            transform-origin: center center;
            pointer-events: none;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
        }

        .lado-izq {
            left: 0;
            top: 3px;
        }

        .lado-der {
            left: 34px;
            top: 3px;
        }

        .lado-arriba {
            left: 17px;
            top: -14px;
            transform: rotate(90deg);
        }

        .lado-abajo {
            left: 17px;
            top: 20px;
            transform: rotate(90deg);
        }

        .diagonal {
            width: 6px;
            height: 48px;
            left: 17px;
            top: -4px;
            transform: rotate(45deg);
        }

        .zona-fosforos {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        /* Controles */
        .controles {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controles button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        .btn-j1 { background: #4a9eff; color: #fff; }
        .btn-j2 { background: #ff6b6b; color: #fff; }

        .info {
            margin-top: 15px;
            padding: 10px 16px;
            background: #333;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🧪 Test de Fósforos</h1>
    <p class="subtitulo">Probá <code>pintarFosforos()</code> sin necesidad del juego completo</p>

    <div class="panel">
        <div class="puntaje-test">
            <h2>J1</h2>
            <div id="malas-j1" class="zona-fosforos malas"></div>
            <div id="buenas-j1" class="zona-fosforos buenas"></div>
        </div>

        <div class="puntaje-test">
            <h2>J2</h2>
            <div id="malas-j2" class="zona-fosforos malas"></div>
            <div id="buenas-j2" class="zona-fosforos buenas"></div>
        </div>
    </div>

    <div class="controles">
        <button class="btn-j1" onclick="sumarPuntosJ1(1)">J1 +1</button>
        <button class="btn-j1" onclick="sumarPuntosJ1(5)">J1 +5</button>
        <button class="btn-j1" onclick="sumarPuntosJ1(-1)">J1 -1</button>
        <button class="btn-j2" onclick="sumarPuntosJ2(1)">J2 +1</button>
        <button class="btn-j2" onclick="sumarPuntosJ2(5)">J2 +5</button>
        <button class="btn-j2" onclick="sumarPuntosJ2(-1)">J2 -1</button>
        <button onclick="resetear()">🔄 Reset</button>
        <button onclick="testSecuencia()">▶ Secuencia auto</button>
    </div>

    <div class="info" id="info">Puntajes: J1 = 0, J2 = 0</div>

    <script src="./fosforos.js"></script>
    <script>
        let puntosJ1 = 0;
        let puntosJ2 = 0;

        function actualizarInfo() {
            document.getElementById('info').textContent =
                `Puntajes: J1 = ${puntosJ1}  |  J2 = ${puntosJ2}`;
        }

        function renderizar() {
            const m1 = Math.min(puntosJ1, 15);
            const b1 = Math.max(puntosJ1 - 15, 0);
            const m2 = Math.min(puntosJ2, 15);
            const b2 = Math.max(puntosJ2 - 15, 0);

            pintarFosforos('malas-j1', m1);
            pintarFosforos('buenas-j1', b1);
            pintarFosforos('malas-j2', m2);
            pintarFosforos('buenas-j2', b2);
            actualizarInfo();
        }

        function sumarPuntosJ1(delta) {
            puntosJ1 = Math.max(0, Math.min(30, puntosJ1 + delta));
            renderizar();
        }
        function sumarPuntosJ2(delta) {
            puntosJ2 = Math.max(0, Math.min(30, puntosJ2 + delta));
            renderizar();
        }
        function resetear() {
            puntosJ1 = 0;
            puntosJ2 = 0;
            renderizar();
        }

        // Secuencia automática que muestra distintas combinaciones
        function testSecuencia() {
            const secuencia = [
                [3, 0], [3, 2], [5, 5], [8, 5], [10, 7],
                [12, 10], [15, 12], [15, 15], [17, 15], [20, 18],
                [23, 20], [25, 22], [28, 25], [30, 28]
            ];
            let i = 0;
            resetear();
            const intervalo = setInterval(() => {
                if (i >= secuencia.length) { clearInterval(intervalo); return; }
                [puntosJ1, puntosJ2] = secuencia[i];
                renderizar();
                i++;
            }, 600);
        }

        // Inicializar
        renderizar();
    </script>
</body>
</html>
